<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер ГГЦ — ЛизаАлерт Республика Коми</title>
    <style>
        /* Переменные для СВЕТЛОЙ темы */
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --la-orange: #ff6600;
            --la-orange-hover: #e05500;
            --text-color: #222222;
            --text-muted: #666666;
            --input-border: #cccccc;
            --input-bg: #ffffff;
            --btn-menu-bg: #eaeaea;
            --btn-menu-hover: #dddddd;
            --card-shadow: rgba(0, 0, 0, 0.08);
            --border-color: #e0e0e0;
        }

        /* Переменные для ТЕМНОЙ темы */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --input-border: #444444;
            --input-bg: #222222;
            --btn-menu-bg: #3a3a3a;
            --btn-menu-hover: #4a4a4a;
            --card-shadow: rgba(0, 0, 0, 0.4);
            --border-color: #444444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-top: 80px;
            position: relative;
        }

        /* Кнопка смены темы */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--card-shadow);
            z-index: 10;
            user-select: none;
        }

        .theme-toggle-btn:hover {
            border-color: var(--la-orange);
        }

        /* Карточка приложения */
        .container {
            background-color: var(--card-bg);
            padding: 35px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--card-shadow);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .logo .dark-text {
            color: #1d2831;
        }
        [data-theme="dark"] .logo .dark-text {
            color: #ffffff;
        }

        .logo .orange-text {
            color: var(--la-orange);
        }

        .region-tag {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .subtitle {
            color: var(--la-orange);
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        label span {
            color: var(--la-orange);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--la-orange);
            box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.2);
        }

        /* Кнопки */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--la-orange);
            color: #ffffff;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--la-orange-hover);
        }

        .btn-menu {
            background-color: var(--btn-menu-bg);
            color: var(--text-color);
            margin-bottom: 12px;
            justify-content: flex-start;
            padding-left: 20px;
            text-transform: none;
            font-weight: 600;
        }

        .btn-menu:hover {
            background-color: var(--btn-menu-hover);
            border-left: 4px solid var(--la-orange);
            padding-left: 16px;
        }

        .btn-total {
            background-color: transparent;
            border: 2px solid var(--la-orange);
            color: var(--la-orange);
            margin-top: 15px;
            text-transform: uppercase;
        }

        .btn-total:hover {
            background-color: var(--la-orange);
            color: #ffffff;
        }

        /* Переключение видимости экранов */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Приветствие */
        .welcome-block {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .welcome-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .user-name {
            color: var(--la-orange);
        }

        /* Мобильная адаптация */
        @media (max-width: 480px) {
            body {
                padding: 75px 12px 20px 12px;
            }
            
            .container {
                padding: 25px 15px;
                border-radius: 10px;
            }

            .logo {
                font-size: 26px;
            }

            .theme-toggle-btn {
                top: 15px;
                right: 15px;
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- Переключатель темы -->
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">
        <span id="theme-icon">☀️</span> <span id="theme-text">Светлая тема</span>
    </button>

    <div class="container">
        <div class="logo-container">
            <div class="logo"><span class="dark-text">ЛИЗА</span><span class="orange-text">АЛЕРТ</span></div>
            <div class="region-tag">Республика Коми</div>
        </div>
        <div class="subtitle">Тенажер топокарт ГГЦ</div>

        <!-- ЭКРАН 1: РЕГИСТРАЦИЯ -->
        <div id="registration-screen" class="screen active">
            <form id="reg-form" onsubmit="handleRegistration(event)">
                <div class="form-group">
                    <label for="fio">ФИО <span>*</span></label>
                    <input type="text" id="fio" required placeholder="Иванов Иван Иванович" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="callsign">Позывной (при наличии)</label>
                    <input type="text" id="callsign" placeholder="Каспер" autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary">Начать</button>
            </form>
        </div>

        <!-- ЭКРАН 2: ГЛАВНОЕ МЕНЮ -->
        <div id="menu-screen" class="screen">
            <div class="welcome-block">
                <div class="welcome-title">Приветствуем, <span id="display-name" class="user-name"></span>!</div>
                <div class="welcome-subtitle">Выберите категорию для тренировки:</div>
            </div>
            
            <div class="menu-buttons">
                <button class="btn btn-menu" onclick="startTest('area')">■ &nbsp; Площадные ориентиры</button>
                <button class="btn btn-menu" onclick="startTest('linear')">⚡ &nbsp; Линейные ориентиры</button>
                <button class="btn btn-menu" onclick="startTest('point')">📍 &nbsp; Точечные ориентиры</button>
                <button class="btn btn-primary btn-total" onclick="startTest('all')">🔥 &nbsp; Общий тест</button>
            </div>
        </div>
    </div>

    <script>
        // Инициализация темы при первой загрузке
        function initTheme() {
            const savedTheme = localStorage.getItem('la_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);
        }

        // Клик по кнопке смены темы
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('la_theme', newTheme);
            updateThemeButton(newTheme);
        }

        // Обновление иконки и текста кнопки
        function updateThemeButton(theme) {
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (theme === 'dark') {
                icon.textContent = '🌙';
                text.textContent = 'Темная тема';
            } else {
                icon.textContent = '☀️';
                text.textContent = 'Светлая тема';
            }
        }

        // Отправка формы регистрации
        function handleRegistration(event) {
            event.preventDefault();
            const fio = document.getElementById('fio').value.trim();
            const callsign = document.getElementById('callsign').value.trim();
            
            localStorage.setItem('la_fio', fio);
            localStorage.setItem('la_callsign', callsign);
            
            showMenu(fio, callsign);
        }

        // Переключение на экран меню
        function showMenu(fio, callsign) {
            const displayName = callsign ? `${fio} (${callsign})` : fio;
            document.getElementById('display-name').textContent = displayName;
            
            document.getElementById('registration-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        }

        function startTest(type) {
            alert('Выбран режим тестирования: ' + type);
        }

        // Запуск при старте страницы
        initTheme();
    </script>
</body>
</html>
