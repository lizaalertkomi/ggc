<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер ГГЦ — ЛизаАлерт</title>
    <style>
        /* Базовые цвета для СВЕТЛОЙ темы */
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --la-orange: #ff6600;
            --la-orange-hover: #e05500;
            --text-color: #222222;
            --text-muted: #666666;
            --input-border: #cccccc;
            --input-bg: #ffffff;
            --btn-menu-bg: #eaeaea;
            --btn-menu-hover: #dddddd;
            --card-shadow: rgba(0, 0, 0, 0.08);
            --border-color: #e0e0e0;
            --success-color: #2e7d32;
            --error-color: #c62828;
        }

        /* Базовые цвета для ТЕМНОЙ темы */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --input-border: #444444;
            --input-bg: #222222;
            --btn-menu-bg: #3a3a3a;
            --btn-menu-hover: #4a4a4a;
            --card-shadow: rgba(0, 0, 0, 0.4);
            --border-color: #444444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            padding-top: 75px;
            position: relative;
        }
        .theme-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 12px var(--card-shadow);
            z-index: 10;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--card-shadow);
            width: 100%;
            max-width: 550px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .logo-container { margin-bottom: 15px; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: 1px; }
        .logo span { color: var(--la-orange); }
        .region-tag { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; opacity: 0.8; }
        .subtitle { color: var(--text-muted); font-size: 12px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }

        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
        label span { color: var(--la-orange); }
        input[type="text"] { width: 100%; padding: 14px; background-color: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; color: var(--text-color); font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--la-orange); box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.2); }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-primary { background-color: var(--la-orange); color: #ffffff; text-transform: uppercase; }
        .btn-primary:hover { background-color: var(--la-orange-hover); }

        .btn-menu { background-color: var(--btn-menu-bg); color: var(--text-color); margin-bottom: 12px; justify-content: flex-start; padding-left: 20px; font-weight: 600; }
        .btn-menu:hover { background-color: var(--btn-menu-hover); border-left: 4px solid var(--la-orange); padding-left: 16px; }
        .btn-total { background-color: transparent; border: 2px solid var(--la-orange); color: var(--la-orange); margin-top: 15px; text-transform: uppercase; }
        .btn-total:hover { background-color: var(--la-orange); color: #ffffff; }

        .screen { display: none; }
        .screen.active { display: block; }
        .welcome-block { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .welcome-title { font-size: 18px; font-weight: 700; }
        .user-name { color: var(--la-orange); }

        .test-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; font-weight: 600; color: var(--text-muted); gap: 10px; }
        .test-header-left { display: flex; flex-direction: column; text-align: left; gap: 2px; }
        
        .map-card { background: #eef0f3; width: 100%; height: 22vh; min-height: 120px; max-height: 180px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px solid var(--border-color); overflow: hidden; }
        .map-card img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 5px; }

        .answers-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; max-height: 45vh; overflow-y: auto; padding-right: 2px; }
        .btn-answer { background-color: var(--btn-menu-bg); color: var(--text-color); font-weight: 500; font-size: 13px; padding: 10px 14px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; text-align: left; width: 100%; line-height: 1.3; word-wrap: break-word; white-space: normal; }
        .btn-answer:hover:not(:disabled) { background-color: var(--btn-menu-hover); border-color: var(--text-muted); }
        .btn-answer.correct { background-color: var(--success-color) !important; color: white !important; font-weight: 700; }
        .btn-answer.wrong { background-color: var(--error-color) !important; color: white !important; }

        .images-answers-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .btn-image-variant { background-color: var(--btn-menu-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 6px; cursor: pointer; height: 14vh; min-height: 85px; max-height: 115px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .btn-image-variant:hover:not(:disabled) { border-color: var(--la-orange); }
        .btn-image-variant img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .btn-image-variant.correct { border-color: var(--success-color) !important; background-color: rgba(46, 125, 50, 0.1); }
        .btn-image-variant.wrong { border-color: var(--error-color) !important; background-color: rgba(198, 40, 40, 0.1); }

        .result-score { font-size: 32px; font-weight: 900; color: var(--la-orange); margin-top: 15px; margin-bottom: 5px; }
        .result-time { font-size: 15px; font-weight: 700; color: var(--text-muted); margin-bottom: 15px; }
        .result-text { font-size: 15px; margin-bottom: 20px; font-weight: 600; line-height: 1.4; }

        @media (max-width: 480px) {
            body { padding: 55px 6px 10px 8px; }
            .container { padding: 15px 10px; border-radius: 8px; }
            .logo { font-size: 20px; }
            .subtitle { margin-bottom: 12px; font-size: 10px; letter-spacing: 1px; }
            .logo-container { margin-bottom: 5px; }
            .welcome-block { margin-bottom: 15px; padding-bottom: 8px; }
            .welcome-title { font-size: 15px; }
            .map-card { height: 110px; margin-bottom: 12px; }
            .answers-grid { gap: 5px; margin-bottom: 12px; }
            .btn-answer { font-size: 12px; padding: 8px 12px; border-radius: 6px; }
            .btn-image-variant { height: 85px; padding: 4px; }
            .images-answers-grid { gap: 8px; margin-bottom: 12px; }
            .btn { padding: 12px; font-size: 14px; }
            .theme-toggle-btn { top: 10px; right: 10px; padding: 6px 10px; font-size: 12px; }
            .result-score { font-size: 28px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">
        <span id="theme-icon">☀️</span> <span id="theme-text">Светлая тема</span>
    </button>

    <div class="container">
        <div class="logo-container">
            <div class="logo">ЛИЗА<span>АЛЕРТ</span></div>
            <div class="region-tag">Республика Коми</div>
        </div>
        <div class="subtitle">Тренажер топокарт ГГЦ</div>

        <!-- ЭКРАН 1: РЕГИСТРАЦИЯ -->
        <div id="registration-screen" class="screen active">
            <div class="form-group">
                <label for="fio">ФИО <span>*</span></label>
                <input type="text" id="fio" placeholder="Иванов Иван Иванович">
            </div>
            <div class="form-group">
                <label for="callsign">Позывной (при наличии)</label>
                <input type="text" id="callsign" placeholder="Каспер">
            </div>
            <button type="button" class="btn btn-primary" onclick="validateAndStart()">Начать</button>
        </div>

        <!-- ЭКРАН 2: ГЛАВНОЕ МЕНЮ -->
        <div id="menu-screen" class="screen">
            <div class="welcome-block">
                <div class="welcome-title">Приветствуем, <span id="display-name" class="user-name"></span>!</div>
            </div>
            <div class="menu-buttons">
                <button class="btn btn-menu" onclick="startTest('area')">■ &nbsp; Площадные ориентиры</button>
                <button class="btn btn-menu" onclick="startTest('linear')">⚡ &nbsp; Линейные ориентиры</button>
                <button class="btn btn-menu" onclick="startTest('point')">📍 &nbsp; Точечные ориентиры</button>
                <button class="btn btn-primary btn-total" onclick="startTest('all')">🔥 &nbsp; Общий тест</button>
            </div>
        </div>

        <!-- ЭКРАН 3: ТЕСТИРОВАНИЕ -->
        <div id="test-screen" class="screen">
            <div class="test-header">
                <div class="test-header-left">
                    <span id="test-category-title">Режим</span>
                    <span id="question-counter">Вопрос: 1/50</span>
                </div>
                <div style="font-size: 16px; font-weight: 700; color: var(--la-orange);" id="timer-display">Время: 00:00</div>
            </div>
            <div class="map-card" id="map-card">
                <img id="question-image" src="" alt="Условный знак ГГЦ">
            </div>
            <div class="answers-grid" id="answers-container"></div>
            <button id="next-btn" class="btn btn-primary" style="display: none;" onclick="nextQuestion()">Следующий вопрос</button>
        </div>

        <!-- ЭКРАН 4: РЕЗУЛЬТАТЫ -->
        <div id="result-screen" class="screen">
            <div class="welcome-title">Тест завершен!</div>
            <div class="result-score" id="result-score-value">Вы набрали 0 баллов</div>
            <div class="result-time" id="result-time-value">Ваше время: 0 минут 0 секунд</div>
            <div class="result-text" id="result-comment">Отличный результат!</div>
            <button class="btn btn-primary" onclick="backToMenu()">Вернуться в меню</button>
        </div>
    </div>
    <script>
        // Чистая база площадных знаков из ТЗ
        const areaDatabase = [
            "Поверхность моховая", "Поверхности кочковатые", "Редкая жилая застройка",
            "Поверхности глинистые", "Кустарнички (багульник, черника, вереск и др.)", 
            "Отдельные группы колючих кустарников", "Заросли кустарника", "Болото проходимое", 
            "Растительность высокотравная (высотой в метр и более)", "Вырубка",
            "Щебёночные и каменистые россыпи", "Растительность травяная, луговая (разнотравье)",
            "Фруктовые сады", "Лес естественный", "Лес с буреломом", "Ягодники", 
            "Поверхности бугристые", "Растительность степная (ковыль, типчак и др.)", 
            "Растительность травяная влаголюбивая (осока, пушица и др.)", "Кладбище", 
            "Непроходимое болото", "Отдельные группы кустарников", "Земли заболоченные",
            "Поверхности песчаные", "Горелый и сухостойный лес", "Овраги и промоины", 
            "Редколесье", "Лес высаженный", "Заросли камышовые и тростниковые", 
            "Поверхности с валунами", "Виноградники", "Промышленные отходы", 
            "Растительность лишайниковая (ягель и др.)", "Заросли колючего кустарника"
        ];

        // Чистая база линейных знаков из ТЗ
        const linearDatabase = [
            "Пересохшее русло реки или ручья", "Обрыв земляной", "Горизонталь",
            "Горизонталь (вариация)", "Обрыв скалистый", "Железная дорога трёхпутная электрифицированная",
            "Железная дорога двухпутная", "Железная дорога однопутная", "Линия электропередач на металлических или железобетонных столбах",
            "Линия электропередач на деревянных опорах", "Газопровод наземный", "Линия связи (телефон, телеграф, радиотрансляция)",
            "Граница государственного заповедника", "Кирпичная стена или металлическая ограда", "Пересыхающий ручей",
            "Ручей", "Река", "Сухой канал", "Река с обрывистым берегом", "Дорога полевая или лесная",
            "Тропа", "Дорога грунтовая", "Дорога грунтовая улучшенная", "Шоссе",
            "Усовершенствованное шоссе", "Автомагистраль", "Фуникулёр", "Дорога с деревянным покрышем",
            "Железная дорога на насыпи", "Дорога проезжая только в холодное время года", "Железная дорога разобранная",
            "Просеки в лесу"
        ];

        // Строгая исходная база точечных знаков без лишних элементов
        const pointDatabase = [
            "Колодец", "Источник не оборудованный", "Источник оборудованный", "Брод по дну реки",
            "Паромная переправа", "Плотина на реке", "Мост через реку", "фонтан",
            "Карьер", "Карьер (вариация)", "Яма (вариация)", "Яма", "Курган (вариация)", "Курган",
            "Отдельно стоящий дом", "Развалины", "Железнодорожная станция", "Завод или фабрика",
            "Кладбище", "Дом лесника", "Церковь", "Электростанция, Завод или фабрика",
            "Вход в пещеру или грот", "Мачта радио или телевизионная", "Торфоразработка",
            "Заводская, фабричная или другая труба", "Камень-ориентир", "Памятник",
            "Аэродром", "Метеорологическая станция", "Мельница ветряная", "Маяк береговой",
            "Пасека", "Отметка высоты над уровнем моря", "Вышка легкая (наблюдательная, спортивная и т.п.)",
            "Вышка капитальная (водонапорная и т.п.)", "Вышка нефтяная или газовая"
        ];

        let currentQuestionsList = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let totalQuestionsCount = 50; 

        let timerSeconds = 0;
        let timerInterval = null;
        // Работа с темой оформления интерфейса
        function initTheme() {
            const savedTheme = localStorage.getItem('la_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('la_theme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (theme === 'dark') { 
                icon.textContent = '🌙'; 
                text.textContent = 'Темная тема'; 
            } else { 
                icon.textContent = '☀️'; 
                text.textContent = 'Светлая тема'; 
            }
        }

        // Работа системного таймера
        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            document.getElementById('timer-display').textContent = "Время: 00:00";
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const secs = (timerSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').textContent = `Время: ${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }
        // Валидация ФИО на первом экране
        function validateAndStart() {
            const fioInput = document.getElementById('fio').value.trim();
            const callsignInput = document.getElementById('callsign').value.trim();

            if (fioInput === "") {
                alert("Пожалуйста, обязательно заполните поле ФИО!");
                document.getElementById('fio').focus();
                return;
            }

            localStorage.setItem('la_fio', fioInput);
            localStorage.setItem('la_callsign', callsignInput);
            showMenu(fioInput, callsignInput);
        }

        function showMenu(fio, callsign) {
            const displayName = callsign ? `${fio} (${callsign})` : fio;
            document.getElementById('display-name').textContent = displayName;
            
            document.getElementById('registration-screen').classList.remove('active');
            document.getElementById('test-screen').classList.remove('active');
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        }

        // Запуск теста со случайным повторением ваших исходных вопросов до 120 штук
        function startTest(type) {
            let activeDb = [];
            let isAllMode = false;
            
            if (type === 'area') {
                window.currentTestModeName = "Площадные ориентиры";
                window.currentImgFolder = "plochad";
                activeDb = areaDatabase;
                totalQuestionsCount = 50;
            } else if (type === 'linear') {
                window.currentTestModeName = "Линейные ориентиры";
                window.currentImgFolder = "line";
                activeDb = linearDatabase;
                totalQuestionsCount = 50;
            } else if (type === 'point') {
                window.currentTestModeName = "Точечные ориентиры";
                window.currentImgFolder = "point";
                activeDb = pointDatabase;
                totalQuestionsCount = 50;
            } else if (type === 'all') {
                window.currentTestModeName = "Общий тест";
                isAllMode = true;
                totalQuestionsCount = 120; // Общий марафон идет строго 120 вопросов
            } else {
                return;
            }

            document.getElementById('test-category-title').textContent = window.currentTestModeName;

            let list = [];
            if (isAllMode) {
                // Миксуем только ваши оригинальные базы данных
                areaDatabase.forEach(name => list.push({ name: name.trim(), folder: "plochad" }));
                linearDatabase.forEach(name => list.push({ name: name.trim(), folder: "line" }));
                pointDatabase.forEach(name => list.push({ name: name.trim(), folder: "point" }));
                window.currentActiveTestDb = [...areaDatabase, ...linearDatabase, ...pointDatabase];
            } else {
                window.currentActiveTestDb = activeDb;
                activeDb.forEach(name => list.push({ name: name.trim(), folder: window.currentImgFolder }));
            }
            
            // Если элементов в базе меньше, циклически копируем их для повтора (без генерации вымышленных слов)
            let originalLength = list.length;
            while(list.length < totalQuestionsCount) {
                let randomItem = list[Math.floor(Math.random() * originalLength)];
                list.push({ ...randomItem });
            }
            
            // Тщательно перемешиваем финальный список, чтобы повторы шли вразнобой
            list.sort(() => 0.5 - Math.random());
            list = list.slice(0, totalQuestionsCount);
            
            currentQuestionsList = list.map(item => {
                let mode = Math.random() > 0.5 ? "text-answers" : "image-answers";
                return { name: item.name, type: mode, folder: item.folder };
            });

            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('test-screen').classList.add('active');
            
            startTimer();
            loadQuestion();
        }

        // Фикс скобок: регулярное выражение безопасно вырезает (вариация) со скобками целиком
        function cleanNameForUser(name) {
            return name.replace(/\s*\(вариация\)/gi, "").trim();
        }
        // Генерация карточки вопроса и сетки вариантов ответов
        function loadQuestion() {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('question-counter').textContent = `Вопрос: ${currentQuestionIndex + 1}/${totalQuestionsCount}`;
            
            const currentQuestion = currentQuestionsList[currentQuestionIndex];
            const container = document.getElementById('answers-container');
            container.innerHTML = '';

            const folder = currentQuestion.folder;
            let poolDb = window.currentActiveTestDb;
            if (window.currentTestModeName === "Общий тест") {
                if (folder === "plochad") poolDb = areaDatabase;
                else if (folder === "line") poolDb = linearDatabase;
                else if (folder === "point") poolDb = pointDatabase;
            }

            const allAllowedNames = poolDb.map(q => q.trim());
            const cleanCorrectName = cleanNameForUser(currentQuestion.name);

            // Режим 1: 1 Картинка + 6 Текстовых вариантов ответов
            if (currentQuestion.type === "text-answers") {
                document.getElementById('test-category-title').textContent = "Определите знак по картинке";
                document.getElementById('map-card').style.display = "flex";
                document.getElementById('question-image').src = `${folder}/${currentQuestion.name}.png`;
                
                let uniqueCleanAnswers = [cleanCorrectName];
                let wrongOptions = allAllowedNames.filter(name => cleanNameForUser(name) !== cleanCorrectName);
                wrongOptions.sort(() => 0.5 - Math.random());
                
                for (let i = 0; i < wrongOptions.length; i++) {
                    let cleanWrong = cleanNameForUser(wrongOptions[i]);
                    if (!uniqueCleanAnswers.includes(cleanWrong)) {
                        uniqueCleanAnswers.push(cleanWrong);
                    }
                    if (uniqueCleanAnswers.length === 6) break;
                }
                
                uniqueCleanAnswers.sort(() => 0.5 - Math.random());
                
                container.className = "answers-grid";
                uniqueCleanAnswers.forEach(answer => {
                    const button = document.createElement('button');
                    button.className = 'btn-answer';
                    button.textContent = answer;
                    button.onclick = () => checkAnswer(button, answer, cleanCorrectName, "text");
                    container.appendChild(button);
                });

            // Режим 2: Название знака + 4 Картинки-варианта ответов
            } else if (currentQuestion.type === "image-answers") {
                document.getElementById('test-category-title').textContent = `Найдите изображение: "${cleanCorrectName}"`;
                document.getElementById('map-card').style.display = "none";
                
                let variantFiles = [{ name: currentQuestion.name, folder: folder }];
                let wrongOptions = allAllowedNames.filter(name => cleanNameForUser(name) !== cleanCorrectName);
                wrongOptions.sort(() => 0.5 - Math.random());
                
                let combinedWrong = [];
                wrongOptions.forEach(wName => {
                    if(!combinedWrong.some(item => cleanNameForUser(item.name) === cleanNameForUser(wName))) {
                        combinedWrong.push({ name: wName, folder: folder });
                    }
                });

                for (let i = 0; i < Math.min(3, combinedWrong.length); i++) { 
                    variantFiles.push(combinedWrong[i]); 
                }
                variantFiles.sort(() => 0.5 - Math.random());
                
                container.className = "images-answers-grid";
                variantFiles.forEach(vFile => {
                    const button = document.createElement('button');
                    button.className = 'btn-image-variant';
                    const img = document.createElement('img');
                    img.src = `${vFile.folder}/${vFile.name}.png`;
                    button.appendChild(img);
                    button.onclick = () => checkAnswer(button, cleanNameForUser(vFile.name), cleanCorrectName, "image");
                    container.appendChild(button);
                });
            }
        }

        // Проверка клика пользователя по кнопкам
        function checkAnswer(selectedButton, selectedAnswer, correctAnswer, mode) {
            const selector = mode === "text" ? '.btn-answer' : '.btn-image-variant';
            const buttons = document.querySelectorAll(selector);
            buttons.forEach(btn => btn.disabled = true);
            
            if (selectedAnswer === correctAnswer) {
                selectedButton.classList.add('correct');
                score++; 
            } else {
                selectedButton.classList.add('wrong');
                buttons.forEach(btn => {
                    if (mode === "text" && btn.textContent === correctAnswer) { btn.classList.add('correct'); }
                    if (mode === "image" && cleanNameForUser(decodeURIComponent(btn.querySelector('img').src.split('/').pop().replace('.png', ''))) === correctAnswer) { 
                        btn.classList.add('correct'); 
                    }
                });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsCount) { loadQuestion(); } 
            else { stopTimer(); showResults(); }
        }

        function pluralize(number, one, two, many) {
            let n = Math.abs(number); n %= 100; if (n >= 5 && n <= 20) return many;
            n %= 10; if (n === 1) return one; if (n >= 2 && n <= 4) return two; return many;
        }
        // Показ финальных результатов и формирование POST-запроса в таблицу
        function showResults() {
            document.getElementById('test-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            const scoreText = pluralize(score, 'балл', 'балла', 'баллов');
            document.getElementById('result-score-value').textContent = `Вы набрали ${score} ${scoreText}`;
            
            const finalMins = Math.floor(timerSeconds / 60); const finalSecs = timerSeconds % 60;
            const minsText = pluralize(finalMins, 'минуту', 'минуты', 'минут');
            const secsText = pluralize(finalSecs, 'секунду', 'секунды', 'секунд');
            
            const timeString = `${finalMins} ${minsText} ${finalSecs} ${secsText}`;
            document.getElementById('result-time-value').textContent = `Ваше время: ${timeString}`;
            
            let comment = ""; var percent = (score / totalQuestionsCount) * 100;
            if (score === totalQuestionsCount) comment = "Пусечка наша! Отличный результат! Карты ГГЦ изучены на высоком уровне. Иди на ПСР :)";
            else if (percent >= 80) comment = "Хороший результат! Но есть незначительные ошибки.";
            else if (percent >= 50) comment = "Удовлетворительно. Рекомендуется повторить условные знаки ГГЦ.";
            else comment = "Нужно потренироваться. Пройдите полный марафон ещё раз!";
            document.getElementById('result-comment').textContent = comment;

            var googleScriptUrl = "https://script.google.com/macros/s/AKfycbxwX2vDIt3Dcc1yaq_aIXV7YxyyoeahN3yjA_vs1KU10fsJmXJX49FcynaI6E5Enlir/exec";

            const payload = {
                testType: window.currentTestModeName || 'Площадные ориентиры',
                fio: localStorage.getItem('la_fio') || 'Не указано',
                callsign: localStorage.getItem('la_callsign') || 'Нет',
                score: `${score} из ${totalQuestionsCount}`,
                time: timeString
            };

            if (googleScriptUrl === "https://google.com") return;

            const fallbackBody = "testType=" + encodeURIComponent(payload.testType) +
                                 "&fio=" + encodeURIComponent(payload.fio) + 
                                 "&callsign=" + encodeURIComponent(payload.callsign) + 
                                 "&score=" + encodeURIComponent(payload.score) + 
                                 "&time=" + encodeURIComponent(payload.time);

            fetch(googleScriptUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: fallbackBody
            }).catch(e => console.log(e));
        }

        function backToMenu() {
            const savedFio = localStorage.getItem('la_fio');
            const savedCallsign = localStorage.getItem('la_callsign');
            showMenu(savedFio, savedCallsign);
        }

        initTheme();
    </script>
</body>
</html>
